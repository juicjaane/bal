services:
  - type: web
    name: blue-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: GEE_CREDENTIALS_JSON
        sync: false
